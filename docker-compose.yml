services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       fockit
      POSTGRES_USER:     fockit
      POSTGRES_PASSWORD: fockit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fockit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT:        3001
      PGHOST:      db
      PGPORT:      5432
      PGDATABASE:  fockit
      PGUSER:      fockit
      PGPASSWORD:  fockit
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
